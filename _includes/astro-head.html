<script>
(function() {
  var saved;
  try { saved = localStorage.getItem('astro-theme'); } catch (e) { saved = null; }
  var theme = (saved === 'theme-light' || saved === 'theme-night') ? saved : 'theme-night';
  document.documentElement.classList.add(theme);
})();
</script>
