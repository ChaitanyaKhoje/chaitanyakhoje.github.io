<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,700;1,6..72,400;1,6..72,500;1,6..72,700&family=Spectral:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="{{ '/assets/css/astro-themes.css' | relative_url }}" />
<link rel="stylesheet" href="{{ '/assets/css/astro-atlas.css' | relative_url }}" />
<link rel="stylesheet" href="{{ '/assets/css/astro-night.css' | relative_url }}" />
<script>
(function() {
  var saved;
  try { saved = localStorage.getItem('astro-theme'); } catch (e) { saved = null; }
  var theme;
  if (saved === 'theme-atlas' || saved === 'theme-night') {
    theme = saved;
  } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
    theme = 'theme-atlas';
  } else {
    theme = 'theme-night';
  }
  document.documentElement.classList.add(theme);
})();
</script>
