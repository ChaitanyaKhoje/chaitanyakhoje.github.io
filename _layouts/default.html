<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{% if page.title and page.title != "" %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet" />
  <script>
    (function() {
      var forced = {% if page.theme %}{{ page.theme | jsonify }}{% else %}null{% endif %};
      var saved = localStorage.getItem('theme');
      var preferred = forced || saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', preferred);
      if (forced) localStorage.setItem('theme', forced);
    })();
  </script>
  <link rel="stylesheet" href="{{ '/assets/css/portfolio.css' | relative_url }}" />
  {% seo %}
</head>
<body class="{{ page.body_class | default: '' }}">

  <nav class="topbar">
    <div class="nav-inner">
      <div class="nav-left">
        {% if page.url == '/' %}
        <a class="nav-link nav-link-inline" href="mailto:chaitanyakhoje9@gmail.com">Email me</a>
        <a class="nav-link nav-link-inline" href="https://www.linkedin.com/in/chaitanyakhoje/" target="_blank" rel="noopener">LinkedIn</a>
        <a class="nav-link nav-link-inline" href="https://github.com/ChaitanyaKhoje" target="_blank" rel="noopener">GitHub</a>
        {% else %}
        Senior Software Engineer · Sunnyvale CA
        {% endif %}
      </div>
      <a class="nav-name" href="{{ '/' | relative_url }}">Chaitanya Khoje</a>
      <div class="nav-right">
        <a class="nav-link" href="{{ '/' | relative_url }}#projects">Projects</a>
        <a class="nav-link" href="{{ '/astrophotography/' | relative_url }}">Astrophotography</a>
        {% unless page.hide_theme_toggle %}
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light/dark mode" title="Toggle theme">
          <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        {% endunless %}
      </div>
    </div>
  </nav>

  {{ content }}

  <script>
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    document.addEventListener('selectstart', function(e) { e.preventDefault(); });
    document.addEventListener('dragstart', function(e) { e.preventDefault(); });
  </script>

  <script>
    (function() {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      var sun = document.getElementById('icon-sun');
      var moon = document.getElementById('icon-moon');

      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        if (theme === 'light') {
          sun.style.display = 'block';
          moon.style.display = 'none';
        } else {
          sun.style.display = 'none';
          moon.style.display = 'block';
        }
      }

      // Sync icon with current theme on load (don't write localStorage here)
      var current = document.documentElement.getAttribute('data-theme') || 'dark';
      if (current === 'light') {
        sun.style.display = 'block';
        moon.style.display = 'none';
      } else {
        sun.style.display = 'none';
        moon.style.display = 'block';
      }

      btn.addEventListener('click', function() {
        var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        applyTheme(next);
      });
    })();
  </script>

</body>
</html>
