title: "Chaitanya Khoje"
tagline: "Building with intent. Operating with discipline. Scaling with care."
author:
  name: "Chaitanya Khoje"
  email: "chaitanyakhoje9@gmail.com"
  github: "chaitanyakhoje"
description: >-
  Chaitanya Khoje's portfolio. Senior software engineer building reliable software
  across data platforms, inference workflows, and production systems.
baseurl: ""
url: "https://chaitanyakhoje.github.io"

# Permalinks
permalink: /posts/:slug/

# Build
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - README.md
  - Rakefile
  - .github
  - docs/
